<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc">
  <title id="title">Starframe architecture overview</title>
  <desc id="desc">Svelte sends requests through Tauri to Rust and receives live state. The planned SQLite transition keeps Rust responsible for local records, ordered collections, downloads, deployment, and update checks. BepInEx starts Starframe's in-game runtime, which owns activation and settings. A replaceable integration interface allows future native game support. Desktop checks stop when the app closes; the runtime ends with the game.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FB923C"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#CBD5E1;font-size:17px}
      .title{font-family:Bahnschrift,'Segoe UI',sans-serif;fill:#F8FAFC;font-size:36px;font-weight:600}
      .heading{fill:#F8FAFC;font-size:21px;font-weight:600}
      .label{fill:#FB923C;font-size:16px}
      .muted{fill:#94A3B8;font-size:15px}
      .box{fill:#1E293B;stroke:#94A3B8;stroke-width:1}
      .line{fill:none;stroke:#FB923C;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="930" fill="#0F172A"/>
  <text x="48" y="61" class="title">Starframe architecture</text>
  <text x="48" y="93">Draft 0.2 · Svelte handles interaction; Rust owns confirmed state and local operations.</text>
  <text x="1232" y="58" text-anchor="end" class="label">06 September 2026</text>

  <rect x="32" y="128" width="1216" height="494" rx="8" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="56" y="161" class="label">Starframe app · active only while open</text>
  <rect x="56" y="190" width="294" height="108" rx="6" class="box"/>
  <text x="76" y="225" class="heading">Svelte + TypeScript</text>
  <text x="76" y="253">Screens, selection, editing drafts</text>
  <text x="76" y="278" class="muted">Immediate feedback; live views</text>

  <rect x="490" y="190" width="274" height="108" rx="6" class="box"/>
  <text x="510" y="225" class="heading">Tauri interface</text>
  <text x="510" y="253">Commands and state channel</text>
  <text x="510" y="278" class="muted">Validated requests; snapshots</text>

  <rect x="900" y="190" width="322" height="108" rx="6" class="box"/>
  <text x="920" y="225" class="heading">Rust application</text>
  <text x="920" y="253">Confirmed state and operations</text>
  <text x="920" y="278" class="muted">Async I/O; bounded blocking work</text>

  <path d="M350 218 H490" class="line"/>
  <text x="419" y="208" text-anchor="middle" class="muted">Requests</text>
  <path d="M490 276 H350" class="line"/>
  <text x="419" y="264" text-anchor="middle" class="muted">Live state</text>
  <path d="M764 218 H900" class="line"/>
  <text x="832" y="208" text-anchor="middle" class="muted">Intent</text>
  <path d="M900 276 H764" class="line"/>
  <text x="832" y="264" text-anchor="middle" class="muted">Results</text>

  <path d="M1061 298 V346 H186 V398" class="line"/>
  <path d="M478 346 V398" class="line"/>
  <path d="M770 346 V398" class="line"/>
  <path d="M1061 346 V398" class="line"/>
  <text x="56" y="328" class="muted">Rust modules · ordinary code in one crate, not separate services</text>

  <rect x="56" y="398" width="262" height="128" rx="6" class="box"/>
  <text x="76" y="434" class="heading">Library + collections</text>
  <text x="76" y="464">Names, mod references, order</text>
  <text x="76" y="491" class="muted">Desired state stays separate</text>
  <text x="76" y="512" class="muted">from files deployed to the game</text>

  <rect x="348" y="398" width="262" height="128" rx="6" class="box"/>
  <text x="368" y="434" class="heading">Catalog + packages</text>
  <text x="368" y="464">Approved releases and imports</text>
  <text x="368" y="491" class="muted">Download → verify → prepare</text>
  <text x="368" y="512" class="muted">Catalog refreshes independently</text>

  <rect x="640" y="398" width="262" height="128" rx="6" class="box"/>
  <text x="660" y="434" class="heading">Deployment + game</text>
  <text x="660" y="464">Plan, apply, recover, launch</text>
  <text x="660" y="491" class="muted">Ordered activation</text>
  <text x="660" y="512" class="muted">Replaceable game integration</text>

  <rect x="932" y="398" width="290" height="128" rx="6" class="box"/>
  <text x="952" y="434" class="heading">App updates</text>
  <text x="952" y="464">Startup + every five minutes</text>
  <text x="952" y="491" class="muted">Quiet notice for a newer release</text>
  <text x="952" y="512" class="muted">The user chooses when to install</text>

  <text x="56" y="570">Slow work leaves navigation and unrelated controls usable.</text>
  <text x="56" y="599" class="muted">Desktop deployment waits for game exit. Desktop checks stop when Starframe closes.</text>

  <path d="M186 622 V708" class="line"/>
  <path d="M478 622 V708" class="line"/>
  <path d="M770 622 V708" class="line"/>
  <path d="M1077 622 V708" class="line"/>

  <rect x="56" y="708" width="262" height="98" rx="6" class="box"/>
  <text x="76" y="743" class="heading">Local app data</text>
  <text x="76" y="773">SQLite records + artifact files</text>

  <rect x="348" y="708" width="262" height="98" rx="6" class="box"/>
  <text x="368" y="743" class="heading">Catalog and authors</text>
  <text x="368" y="773">Metadata + direct downloads</text>

  <rect x="640" y="708" width="262" height="98" rx="6" class="box"/>
  <text x="660" y="743" class="heading">Sanctuary installation</text>
  <text x="660" y="773">Starframe runtime + BepInEx</text>

  <rect x="932" y="708" width="290" height="98" rx="6" class="box"/>
  <text x="952" y="743" class="heading">Starframe releases</text>
  <text x="952" y="773">Official GitHub repository</text>

  <text x="48" y="864">The C# runtime owns loading and settings. Future native mod support replaces the current integration.</text>
  <text x="48" y="893" class="muted">ARCHITECTURE.md contains detailed flows and verification requirements · planning only; no application code built</text>
</svg>
