<style>

.window{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:680px;height:calc(100vh - 135px);min-width:0}.sidebar{background:var(--surface);padding:28px 16px 16px;display:flex;flex-direction:column;gap:32px;border-right:1px solid var(--selected)}.brand{display:flex;gap:10px;align-items:center;color:var(--white);font:600 23px Bahnschrift,'Segoe UI',sans-serif}.brand img{width:38px;height:38px}.subtitle{font-size:11px;line-height:1.5;margin:7px 0 0 48px;color:var(--muted)}nav{display:grid;gap:4px}nav button{text-align:left;display:flex;gap:12px;align-items:center;border-color:transparent}nav button[aria-current=page]{background:var(--selected);color:var(--white);font-weight:600}nav button[aria-current=page]::after{content:'✓';margin-left:auto;color:var(--pale)}.nav-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}.side-bottom{margin-top:auto;display:grid;gap:4px}.body{display:flex;flex-direction:column;min-width:0;min-height:0}.page-header{padding:26px 24px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--selected)}.page-header p{margin-top:6px;color:var(--muted)}.workspace{padding:24px;flex:1;overflow:auto;min-width:0}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.tools input[type=search]{flex:1;min-width:180px}.tools label{display:flex;align-items:center;gap:8px}.notice{padding:12px 16px;background:var(--surface);border:1px solid var(--muted);border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.notice p{font-size:13px}.table-head,.modrow{display:grid;grid-template-columns:24px minmax(160px,1.4fr) minmax(110px,1fr) minmax(155px,1.3fr) 58px;gap:16px;align-items:center}.table-head{font-size:12px;color:var(--muted);padding:0 12px 10px;border-bottom:1px solid var(--selected)}.modrow{min-height:76px;padding:12px;border-bottom:1px solid var(--selected)}.modrow:hover{background:var(--surface)}.modrow.selected{background:var(--selected)}.modrow.selected small{color:var(--body)}.modname{border:0;padding:0;text-align:left;min-height:0;font-weight:600;color:var(--white)}.modname:hover{text-decoration:underline;background:none}.modrow small{display:block;margin-top:3px}.compat{font-size:12px}.switch{width:38px;height:22px;min-height:22px;padding:2px;border-radius:20px;background:var(--canvas);border:1px solid var(--muted);position:relative}.switch::after{content:'';display:block;width:16px;height:16px;border-radius:50%;background:var(--body);transition:transform 100ms ease}.switch[aria-checked=true]{background:var(--orange);border-color:var(--orange)}.switch[aria-checked=true]::after{background:var(--canvas);transform:translateX(14px)}.bulk{padding:10px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.launch{padding:16px 24px;border-top:1px solid var(--selected);display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--surface)}.launch strong{color:var(--white)}.launch .primary{min-width:136px;min-height:40px}.launch p{font-size:12px;color:var(--muted);margin-top:3px}.empty{padding:64px 16px;text-align:center;display:grid;gap:12px;justify-items:center}.empty h2{font:600 24px Bahnschrift,sans-serif}.collection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.collection{padding:24px;border:1px solid var(--muted);border-radius:8px;text-align:left;min-height:156px;display:grid;gap:16px}.collection.active{background:var(--surface)}.collection-header{border-bottom:1px solid var(--selected);padding:0 0 24px;margin-bottom:20px}.collection-header h2{font:600 26px Bahnschrift,sans-serif}.order-row{display:flex;gap:16px;align-items:center;min-height:76px;border-bottom:1px solid var(--selected);padding:12px 0}.order-row .order-name{flex:1;min-width:0}.order-row .number{font-variant-numeric:tabular-nums;color:var(--muted);width:24px}.order-row[draggable=true]{cursor:grab}.order-row.dragging{opacity:.7}.order-row .moves{display:flex;gap:4px}.order-row .moves button{padding:4px 10px}.order-row .handle{color:var(--muted);font-size:20px}.detail{border-left:1px solid var(--muted);background:var(--surface);padding:24px;max-width:360px;position:fixed;right:0;top:135px;bottom:0;width:360px;overflow:auto;z-index:5;animation:reveal 200ms cubic-bezier(.2,0,0,1)}.detail h2{font:600 24px Bahnschrift,sans-serif;margin:20px 0 8px}.detail dl{display:grid;grid-template-columns:100px 1fr;gap:10px;font-size:13px}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.detail .stack{margin-top:24px}.settings-list{max-width:760px}.setting{padding:20px 0;border-bottom:1px solid var(--selected);display:flex;justify-content:space-between;align-items:center;gap:24px}.setting p{font-size:13px;color:var(--muted);margin-top:4px}.setting input[type=range]{width:160px;accent-color:var(--orange)}.setting select{max-width:180px}.task{padding:20px 0;border-bottom:1px solid var(--selected)}progress{width:100%;height:6px;accent-color:var(--orange);margin:12px 0}.game-stage{padding:48px 24px;min-height:680px;background:#0F172A}.game-caption{max-width:920px;margin:0 auto 16px;font-size:12px;color:var(--muted)}.game-panel{max-width:920px;margin:auto;border:1px solid var(--muted);background:var(--surface)}.game-heading{padding:20px 24px;border-bottom:1px solid var(--muted)}.game-grid{display:grid;grid-template-columns:220px 1fr;min-height:430px}.game-nav{padding:20px 12px;border-right:1px solid var(--selected)}.game-settings{padding:24px;min-width:0}.game-settings .muted{margin-top:6px}.game-footer{padding:16px 24px;border-top:1px solid var(--muted);font-size:12px}.identity{max-width:1100px;margin:auto;padding:40px 24px}.identity h1{margin-bottom:12px}.identity .brand{font-size:56px;gap:24px}.identity .brand img{width:112px;height:112px}.identity-board{padding:40px;border:1px solid var(--muted);margin:28px 0;background:var(--surface)}.identity-board.light{background:var(--white);color:var(--canvas)}.identity-board.light .brand{color:var(--canvas)}.sizes{display:flex;align-items:end;gap:32px;flex-wrap:wrap;margin-top:32px}.sizes figure{margin:0;display:grid;justify-items:center;gap:12px}.sizes figcaption{font-size:12px}.identity-note{max-width:720px}.swatches{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}.swatch{width:112px}.swatch div{height:48px;border:1px solid var(--muted);margin-bottom:8px}.swatch code{font-size:12px}dialog{background:var(--surface);color:var(--body);border:1px solid var(--muted);border-radius:12px;width:min(520px,calc(100% - 32px));padding:24px;animation:dialog-in 180ms cubic-bezier(.2,0,0,1)}dialog::backdrop{background:#0F172ACC}dialog h2{margin-bottom:12px}dialog p{margin-bottom:16px}dialog .row{margin-top:24px;justify-content:flex-end}dialog textarea{width:100%;min-height:160px;font-family:Consolas,monospace;font-size:12px}.skip{position:absolute;left:12px;top:-100px;z-index:20;background:var(--orange);color:var(--canvas);padding:8px}.skip:focus{top:12px}.mobile-menu{display:none}
@keyframes reveal{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}@keyframes dialog-in{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
html.reduce *,html.reduce *::after{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
@media(max-width:1100px){.window{grid-template-columns:176px 1fr}.sidebar{padding-left:12px;padding-right:12px}.brand{font-size:20px}.modrow,.table-head{grid-template-columns:24px minmax(140px,1fr) minmax(110px,1fr) 50px}.version-cell{display:none}.detail{top:0;bottom:0;width:calc(100% - 176px);max-width:none}.review{padding:12px 16px}}
@media(max-width:800px){.window{display:flex;flex-direction:column;height:auto;min-height:680px}.sidebar{display:none}.window.menu-open .sidebar{display:flex}.mobile-menu{display:inline-block}.page-header,.workspace,.launch{padding:20px 16px}.modrow,.table-head{grid-template-columns:24px minmax(120px,1fr) 48px;gap:10px}.compat-cell{grid-column:2;grid-row:2}.modrow .toggle-cell{grid-column:3;grid-row:1}.modrow{padding:12px 0}.table-head .compat-cell{display:none}.detail{width:100%;top:0}.game-grid{grid-template-columns:1fr}.game-nav{border-right:0;border-bottom:1px solid var(--selected)}.game-nav nav{display:flex;flex-wrap:wrap}.game-stage{padding:24px 12px}.game-settings{padding:20px 16px}.identity .brand{font-size:36px;gap:12px}.identity .brand img{width:72px;height:72px}.identity-board{padding:24px}.setting{gap:12px;flex-wrap:wrap}.review{gap:8px}.review .views{flex-wrap:wrap}.launch{flex-wrap:wrap}.order-row{gap:8px}.order-row .moves{flex-direction:column}.page-header .row{width:100%}}
@media(forced-colors:active){button,input,select,.notice,.collection,.game-panel{border-color:ButtonText}.switch[aria-checked=true]{background:Highlight}.switch::after{background:ButtonText}.switch[aria-checked=true]::after{background:HighlightText}nav button[aria-current=page]{outline:1px solid Highlight}.primary{background:ButtonFace;color:ButtonText}.brand img{forced-color-adjust:none}}
</style>
<a class="skip" href="#main">Skip to workspace</a>
<header class="review"><strong>Starframe / design review</strong><div class="views" aria-label="Specimen views"><button data-view="desktop" aria-pressed="true">Desktop</button><button data-view="game" aria-pressed="false">In-game settings</button><button data-view="identity" aria-pressed="false">Identity</button></div><label>Scenario <select id="scenario"><option value="normal">Normal</option><option value="running">Game running</option><option value="error">Download error</option><option value="empty">Empty library</option></select></label><label><input type="checkbox" id="motion">Reduced motion</label><button id="reset" class="quiet">Reset specimen</button></header>
<div class="review-note">0.0.1 · Design specimen with fictional mods and builds. All actions are simulated in memory. No downloads or game access.</div>
<main id="main" tabindex="-1"></main><aside id="detail" class="detail" hidden aria-label="Mod details"></aside><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div class="sr" id="announce" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const icons={mods:'M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h6v6h-6z',catalog:'M4 3h16v18H4zM8 7h8M8 11h8M8 15h5',collections:'M3 7h7l2-3h9v16H3z',downloads:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',settings:'M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6',help:'M9 8a3 3 0 1 1 4 3c-1 1-1 2-1 3M12 18h.01'};
const icon=k=>`<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[k]}"></path></svg>`;
const initial=[{id:'core',name:'Core Library',version:'1.4.0',origin:'Catalog release',description:'Shared tools used by other mods in this specimen.',compat:'Compatible with example build 3',enabled:true},{id:'terrain',name:'Terrain Tools',version:'0.8.2',origin:'Catalog release',description:'Inspect terrain height and map layers.',compat:'Made for a previous game version',enabled:true},{id:'tactical',name:'Tactical Overlay',version:'2.1.0',origin:'Catalog release',description:'Show unit ranges and selected-unit information.',compat:'Compatible with example build 3',enabled:true},{id:'fleet',name:'Fleet Labels',version:'Local build',origin:'Local import',description:'A local development build for custom fleet labels.',compat:'Local import · version checks off',enabled:false}];
let newCollection=false;let gameSettings={ranges:true,scale:100,density:'Standard',extended:false};let savedCollections={Skirmish:['core','terrain','tactical'],Minimal:['core'],Sandbox:[]};
let mods=structuredClone(initial),view='desktop',page='mods',scenario='normal',search='',selected=new Set(),requested=['core','terrain','tactical'],collection='Skirmish',collectionOpen=false,running=false,pending=false,orderNote='',download=0,downloadTimer=null,menu=false,returnFocus=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function invalidSetup(){return requested.includes('terrain')&&!requested.includes('core')}
function say(message){$('#announce').textContent=message}
function render(){const focus=document.activeElement?.id;const start=document.activeElement?.selectionStart;$('#detail').hidden=true;$('#main').innerHTML=view==='identity'?identity():view==='game'?game():desktop();if(focus&&document.getElementById(focus)){document.getElementById(focus).focus();if(start!=null)try{document.getElementById(focus).setSelectionRange(start,start)}catch{}}if(view==='game'){$('#range-visible').checked=gameSettings.ranges;$('#overlay-scale').value=gameSettings.scale;$('#scale-value').textContent=gameSettings.scale+'%';$('#density').value=gameSettings.density;$('#extended').checked=gameSettings.extended}document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)))}
function desktop(){const names={mods:'My mods',catalog:'Catalog',collections:'Collections',downloads:'Downloads',settings:'Settings',help:'Help & logs'};return `<div class="window ${menu?'menu-open':''}"><aside class="sidebar"><div><div class="brand"><img src="starframe-mark.svg" alt="">Starframe</div><div class="subtitle">Sanctuary: Shattered Sun</div></div><nav aria-label="Main navigation">${['mods','catalog','collections','downloads'].map(k=>`<button data-page="${k}" aria-current="${page===k?'page':'false'}">${icon(k)}${names[k]}</button>`).join('')}</nav><div class="side-bottom"><button data-action="update" class="quiet accent">Update available</button><nav aria-label="Support">${['settings','help'].map(k=>`<button data-page="${k}" aria-current="${page===k?'page':'false'}">${icon(k)}${names[k]}</button>`).join('')}</nav><small>Design build 0.0.1</small></div></aside><div class="body"><header class="page-header"><div><button class="mobile-menu quiet" data-action="menu">Navigation</button><h1>${names[page]}</h1><p>${page==='mods'?'Your installed mods, ready for the next launch.':page==='catalog'?'Releases reviewed for the Starframe catalog.':page==='collections'?'A name, a mod list, and the order they load.':page==='downloads'?'Downloads and changes to your game.':page==='settings'?'Game setup and Starframe preferences.':'Find the information needed to resolve a problem.'}</p></div>${['mods','catalog'].includes(page)?'<button data-action="local">Import local mod</button>':page==='collections'?'<div class="row"><button data-action="import">Import collection</button><button data-action="create">New collection</button></div>':''}</header><section class="workspace" aria-label="${names[page]}">${page==='mods'||page==='catalog'?list():page==='collections'?collections():page==='downloads'?downloads():page==='settings'?settings():help()}</section><footer class="launch"><div><strong>${esc(collection)}</strong><p id="readiness">${invalidSetup()?'Core Library is required by Terrain Tools':pending?'Waiting for game to close · changes saved':running?'Game running · desktop edits apply after exit':scenario==='empty'?'Ready to launch without mods':`${mods.filter(m=>m.enabled).length} mods enabled · 1 game-version warning`}</p></div><div class="row"><button class="quiet" data-action="issues">View issues</button><button class="primary" id="play" data-action="play" ${running||invalidSetup()?'disabled':''}>${running?'Game running':'Play'}</button></div></footer></div></div>`}
function list(){const rows=scenario==='empty'&&page==='mods'?[]:mods.filter(m=>m.name.toLowerCase().includes(search.toLowerCase()));return `${pending?'<div class="notice"><p><strong>Changes saved.</strong> They will apply when the game closes.</p><button data-action="closegame">Simulate game exit</button></div>':''}<div class="tools"><label for="search" class="sr">Search mods</label><input id="search" type="search" placeholder="Search mods" value="${esc(search)}"><label>Collection <select id="collection"><option ${collection==='Skirmish'?'selected':''}>Skirmish</option><option ${collection==='Minimal'?'selected':''}>Minimal</option></select></label></div>${selected.size?`<div class="bulk"><strong>${selected.size} selected</strong><button data-action="enableSelected">Enable selected</button><button data-action="disableSelected">Remove from collection</button><button class="quiet" data-action="clear">Clear selection</button></div>`:''}${!rows.length?`<div class="empty"><h2>${search?'No matching mods':'No mods installed'}</h2><p>${search?'Try another name or clear your search.':'Browse approved releases or import a local build.'}</p><button data-action="${search?'clearSearch':'browse'}">${search?'Clear search':'Browse catalog'}</button></div>`:`<div class="table-head"><span></span><span>Mod</span><span class="version-cell">Version / origin</span><span class="compat-cell">Compatibility</span><span>${page==='catalog'?'Action':'Enabled'}</span></div><div role="list" aria-label="Mods">${rows.map(m=>`<div class="modrow ${selected.has(m.id)?'selected':''}" role="listitem"><input type="checkbox" data-select="${m.id}" id="select-${m.id}" aria-label="Select ${m.name}" ${selected.has(m.id)?'checked':''}><div><button class="modname" id="details-${m.id}" data-detail="${m.id}">${m.name}</button><small>${m.id==='terrain'?'Requires Core Library':m.description}</small></div><div class="version-cell">${m.version}<small>${m.origin}</small></div><div class="compat-cell compat">${m.id==='terrain'?'<span aria-hidden="true">△ </span>':''}${m.compat}</div><div class="toggle-cell">${page==='catalog'?`<button data-action="install" aria-label="Install ${m.name}">Install</button>`:`<button role="switch" aria-checked="${m.enabled}" aria-label="Enable ${m.name}" id="toggle-${m.id}" data-toggle="${m.id}" class="switch"></button>`}</div></div>`).join('')}</div>`}<p class="muted" style="margin-top:20px">${page==='catalog'?'Catalog checked just now · updates independently of the app':'Enabling a mod adds it to the active collection. Downloaded files stay in your library.'}</p>`}
function effective(){const list=[...requested];if(list.includes('terrain')&&list.includes('core')&&list.indexOf('terrain')<list.indexOf('core')){list.splice(list.indexOf('core'),1);list.splice(list.indexOf('terrain'),0,'core')}return list}
function collections(){if(!collectionOpen)return `<div class="collection-grid">${Object.keys(savedCollections).map((name,i)=>`<button class="collection ${collection===name?'active':''}" data-open="${name}"><h2>${name}</h2><p>${i===0?'Core tools and tactical information':i===1?'Only the shared core library':savedCollections[name].length+' mods in this collection'}</p><small>${collection===name?'✓ Active collection':'Open collection'}</small></button>`).join('')}</div>`;return `<div class="collection-header row between"><div><button class="quiet" data-action="backcollections">Back to collections</button><h2>${esc(collection)}</h2><p class="muted">${requested.length} mods · settings stay with each mod</p></div><div class="row"><button data-action="rename">Rename</button><button data-action="share">Share</button></div></div><div class="notice"><p><strong>Load order</strong><br>Drag a row or use its move buttons. Required dependencies load first.</p></div><p id="order-note" role="status" style="margin-bottom:12px">${orderNote||'Changes save and apply automatically when the game is closed.'}</p>${effective().length?`<div role="list" aria-label="Effective load order">${effective().map((id,n)=>{const m=mods.find(m=>m.id===id);if(!m)return '';return `<div class="order-row" role="listitem" draggable="true" data-drag="${id}"><span class="handle" aria-hidden="true">⠿</span><span class="number">${String(n+1).padStart(2,'0')}</span><div class="order-name"><h3>${m.name}</h3><small>${id==='terrain'?'Requires Core Library':m.origin+' · '+m.version}</small></div><div class="moves"><button id="up-${id}" data-move="${id}" data-delta="-1" aria-label="Move ${m.name} up" ${n===0?'disabled':''}>↑</button><button id="down-${id}" data-move="${id}" data-delta="1" aria-label="Move ${m.name} down" ${n===effective().length-1?'disabled':''}>↓</button></div></div>`}).join('')}</div>`:'<div class="empty"><h2>No mods in this collection</h2><p>Add mods from your library to create a setup.</p><button data-action="mymods">Open My mods</button></div>'}${pending?'<div class="notice" style="margin-top:24px"><p>Waiting for game to close. Your latest order is saved.</p><button data-action="closegame">Simulate game exit</button></div>':''}`}
function downloads(){return `<div class="task"><div class="row between"><h2>Terrain Tools</h2><span>${scenario==='error'?'Download failed':download>=100?'Ready in library':download>0?'Downloading':'Not downloading'}</span></div><p style="margin-top:8px">${scenario==='error'?'The source could not be reached. Your current game setup is unchanged.':'Approved release 0.8.2 · simulated transfer'}</p><progress value="${download}" max="100" aria-label="Download progress"></progress><div class="row between"><span>${download}%</span><button data-action="${download>0&&download<100?'cancelDownload':'install'}">${download>0&&download<100?'Cancel':scenario==='error'?'Retry':'Simulate download'}</button></div></div><p class="muted" style="margin-top:20px">Browse other views during the transfer. The specimen reports progress without blocking navigation.</p>`}
function settings(){return `<div class="settings-list"><div class="setting"><div><h2>Game installation</h2><p>Sanctuary: Shattered Sun · example build 3</p></div><button data-action="setup">Game setup</button></div><div class="setting"><div><h2>Starframe updates</h2><p>Checks at startup and every five minutes while open.</p></div><button data-action="update">Update available</button></div><div class="setting"><div><h2>Mod configuration</h2><p>Open the Starframe settings view inside the game.</p></div><button data-action="gameview">Preview in-game UI</button></div><div class="setting"><div><h2>Remove Starframe from game</h2><p>Restore owned files. Keep your mods and settings.</p></div><button data-action="cleanup" ${running?'disabled':''}>Remove integration</button></div>${running?'<p class="muted">Game cleanup is available when the game closes.</p>':''}</div>`}
function help(){return `<div class="settings-list stack"><h2>Help & logs</h2><p>Start with the mod's details for dependencies, source and load-order restrictions.</p><details><summary>Why is a mod marked for a previous game version?</summary><p style="margin:12px 0">It was made or checked for an older game build. You can still enable it and try launching.</p></details><details><summary>Why have my changes not applied?</summary><p style="margin:12px 0">Changes wait while the game runs. Keep Starframe open to apply them after exit, or reopen it before your next launch.</p></details><button data-action="logs">Preview diagnostics</button></div>`}
function game(){return `<section class="game-stage"><p class="game-caption">In-game UI specimen · the solid panel preserves contrast over game content. No game artwork is used.</p><div class="game-panel"><header class="game-heading row between"><div class="brand"><img src="starframe-mark.svg" alt="">Starframe <span class="muted">Mod settings</span></div><button data-action="desktopview">Close preview</button></header><div class="game-grid"><aside class="game-nav"><nav aria-label="In-game mod settings"><button aria-current="page">Tactical Overlay</button><button data-action="coreSettings">Core Library</button><button data-action="terrainSettings">Terrain Tools</button></nav></aside><section class="game-settings"><h1>Tactical Overlay</h1><p class="muted">Loaded · 2.1.0 · example mod</p><div class="setting"><div><h3>Show weapon ranges</h3><p>Display range rings for selected units.</p></div><input id="range-visible" type="checkbox" checked aria-label="Show weapon ranges"></div><div class="setting"><div><h3>Overlay scale</h3><p>Adjust labels and range markers.</p></div><div class="row"><input id="overlay-scale" type="range" min="75" max="150" value="100" aria-label="Overlay scale"><output id="scale-value" for="overlay-scale">100%</output></div></div><div class="setting"><div><h3>Information density</h3><p>Choose how much detail is shown.</p></div><select id="density" aria-label="Information density"><option>Standard</option><option>Compact</option><option>Detailed</option></select></div><div class="setting"><div><h3>Extended unit information</h3><p>Takes effect after restart.</p></div><input id="extended" type="checkbox" aria-label="Extended unit information"></div><p id="game-saved" class="muted" role="status" style="margin-top:20px">Settings save to this mod. Changing collection keeps these values.</p></section></div><footer class="game-footer">Changes save automatically. The game-side settings remain available after the desktop app closes.</footer></div></section>`}
function identity(){return `<section class="identity"><h1>A frame around a sun</h1><p class="identity-note">An open structural frame gives Starframe its own mark. The orange center refers to the sun; the separated frame pieces suggest a structure that can be assembled and changed.</p>${[false,true].map(light=>`<div class="identity-board ${light?'light':''}"><div class="brand"><img src="starframe-mark${light?'-light':''}.svg" alt="Starframe mark">Starframe</div><div class="sizes">${[64,48,32,24,16].map(size=>`<figure><img src="starframe-mark${light?'-light':''}.svg" width="${size}" height="${size}" alt=""><figcaption>${size} px</figcaption></figure>`).join('')}</div></div>`).join('')}<div class="identity-note stack"><h2>Geometry carries the identity</h2><p>The mark uses flat fills and straight frame segments, with no glow or orbit animation. The circular center belongs to the name; it is not a general-purpose status icon. The wordmark uses the existing Bahnschrift heading face.</p><p class="muted">Original SVG geometry created for Starframe. No game logo, downloaded art or bundled font files. The light surface is an icon test, not a second app theme.</p></div><div class="swatches">${['#0F172A','#F97316','#FB923C','#334155','#CBD5E1','#F8FAFC'].map(c=>`<div class="swatch"><div style="background:${c}"></div><code>${c}</code></div>`).join('')}</div></section>`}
function dialog(title,content,buttons='<button data-action="dismiss">Close</button>'){returnFocus=document.activeElement;$('#dialog').innerHTML=`<h2 id="dialog-title">${title}</h2>${content}<div class="row">${buttons}</div>`;$('#dialog').showModal()}
function closeDialog(){$('#dialog').close();if(returnFocus?.isConnected)returnFocus.focus()}
function changed(){savedCollections[collection]=[...requested];pending=running;render();say(running?'Change saved. Waiting for game to close.':'Change applied to the simulated setup.')}
function move(id,to){const list=effective();list.splice(list.indexOf(id),1);list.splice(Math.max(0,Math.min(to,list.length)),0,id);requested=list;orderNote=effective().join()!==requested.join()?'Core Library must load before Terrain Tools. The effective order keeps that dependency first.':'Order saved.';changed();say(orderNote);const up=document.getElementById('up-'+id);(up?.disabled?document.getElementById('down-'+id):up)?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.page){page=b.dataset.page;menu=false;search='';render();return}if(b.dataset.toggle){const m=mods.find(m=>m.id===b.dataset.toggle);m.enabled=!m.enabled;requested=mods.filter(m=>m.enabled).map(m=>m.id);changed();return}if(b.dataset.detail){const m=mods.find(m=>m.id===b.dataset.detail);returnFocus=b;$('#detail').innerHTML=`<button data-action="closedetail">Close details</button><h2>${m.name}</h2><p>${m.description}</p><dl><dt>Version</dt><dd>${m.version}</dd><dt>Origin</dt><dd>${m.origin}</dd><dt>Compatibility</dt><dd>${m.compat}</dd><dt>Dependency</dt><dd>${m.id==='terrain'?'Core Library':'None declared'}</dd></dl><div class="stack"><p class="muted">Fictional metadata for design review.</p><button data-action="source">View source information</button><button data-uninstall="${m.id}">Uninstall</button></div>`;$('#detail').hidden=false;$('#detail button').focus();return}if(b.dataset.uninstall){const id=b.dataset.uninstall;mods=mods.filter(m=>m.id!==id);requested=requested.filter(x=>x!==id);selected.delete(id);changed();return}if(b.dataset.open){collection=b.dataset.open;requested=[...(savedCollections[collection]||[])];mods.forEach(m=>m.enabled=requested.includes(m.id));collectionOpen=true;changed();return}if(b.dataset.move){move(b.dataset.move,effective().indexOf(b.dataset.move)+Number(b.dataset.delta));return}const a=b.dataset.action;if(a==='closedetail'){$('#detail').hidden=true;returnFocus?.focus()}else if(a==='dismiss')closeDialog();else if(a==='menu'){menu=!menu;render()}else if(a==='play'){running=true;scenario='running';$('#scenario').value='running';changed()}else if(a==='closegame'){running=false;pending=false;scenario='normal';$('#scenario').value='normal';render();say('Game exited. Latest saved changes applied.')}else if(a==='clear'){selected.clear();render()}else if(a==='enableSelected'||a==='disableSelected'){mods.forEach(m=>{if(selected.has(m.id))m.enabled=a==='enableSelected'});requested=mods.filter(m=>m.enabled).map(m=>m.id);changed()}else if(a==='clearSearch'){search='';render()}else if(a==='browse'){page='catalog';render()}else if(a==='mymods'){page='mods';render()}else if(a==='backcollections'){collectionOpen=false;render()}else if(a==='gameview'||a==='desktopview'){view=a==='gameview'?'game':'desktop';render()}else if(a==='share'){dialog('Share collection','<p>Copy this sample reference file. The receiver reuses downloaded matches and gets missing approved releases.</p><label for="share-json">Collection JSON</label><textarea id="share-json" readonly>'+esc(JSON.stringify({schemaVersion:1,name:collection,mods:effective().map(id=>({modId:'example.'+id,releaseId:'example.'+id+'.1'}))},null,2))+'</textarea>')}else if(a==='import'){dialog('Import collection','<p><strong>Skirmish</strong> · 3 ordered mod references</p><p>Core Library and Tactical Overlay are already available. Terrain Tools will be downloaded from its approved source.</p><p class="muted">No mod settings or binaries are included.</p>','<button data-action="dismiss">Cancel</button><button class="primary" data-action="importConfirm">Import collection</button>')}else if(a==='importConfirm'){closeDialog();collection='Skirmish';requested=['core','terrain','tactical'];collectionOpen=true;page='collections';changed();say('Sample collection imported; missing artifact download simulated.')}else if(a==='create'||a==='rename'){newCollection=a==='create';dialog(a==='create'?'New collection':'Rename collection','<label for="name-input">Collection name</label><input id="name-input" maxlength="80" value="'+(a==='rename'?esc(collection):'New collection')+'">','<button data-action="dismiss">Cancel</button><button class="primary" data-action="saveName">Save name</button>')}else if(a==='saveName'){const name=$('#name-input').value.trim();if(!name){$('#name-input').focus();return}if(newCollection){requested=[];mods.forEach(m=>m.enabled=false)}else{delete savedCollections[collection]}collection=name;closeDialog();page='collections';collectionOpen=true;changed()}else if(a==='install'){scenario='normal';$('#scenario').value='normal';download=0;page='downloads';clearInterval(downloadTimer);downloadTimer=setInterval(()=>{download=Math.min(100,download+10);if(page==='downloads'&&view==='desktop')render();if(download===100){clearInterval(downloadTimer);say('Sample download completed.')}},500);render()}else if(a==='cancelDownload'){clearInterval(downloadTimer);download=0;render();say('Download canceled.')}else if(a==='update'){dialog('Starframe update available','<p>Installed: 0.0.1 · Available: 0.0.2</p><p>Example release notes: improved collection import feedback and local-build status.</p><p class="muted">'+(running?'Available when the game closes. This update includes the in-game runtime.':'You choose when to install. Checks stop when Starframe closes.')+'</p>','<button data-action="releaseNotes">View release</button><button data-action="dismiss">Later</button><button class="primary" data-action="simulateUpdate" '+(running?'disabled':'')+'>Update</button>')}else if(a==='simulateUpdate'){closeDialog();dialog('Update demonstration','<p>The installed app would finish file operations, verify the signed update and start the installer. This specimen installs nothing.</p>')}else if(a==='releaseNotes'){closeDialog();dialog('Example release notes','<p>Clearer collection import progress and pending local-build labels. These notes describe fictional specimen versions.</p>')}else if(a==='setup'){dialog('Set up Sanctuary','<p>1. Locate the game installation.</p><p>2. Review the Starframe runtime and BepInEx bootstrap files.</p><p>3. Apply the owned-file plan and verify setup.</p><p class="muted">The installed app uses a native folder picker. This specimen uses an example location.</p>','<button data-action="dismiss">Cancel</button><button class="primary" data-action="setupConfirm">Use example installation</button>')}else if(a==='setupConfirm'){closeDialog();say('Example game setup confirmed.')}else if(a==='local'){dialog('Import local mod','<p>Choose a compiled DLL or supported mod folder in the installed app. Starframe manages a copy and keeps your source files.</p><p class="muted">The specimen can add Fleet Labels as a local example.</p>','<button data-action="dismiss">Cancel</button><button class="primary" data-action="localConfirm">Add local example</button>')}else if(a==='localConfirm'){closeDialog();if(!mods.some(m=>m.id==='fleet'))mods.push(structuredClone(initial[3]));scenario='normal';$('#scenario').value='normal';page='mods';changed()}else if(a==='issues'){dialog('Setup notices','<p><strong>Terrain Tools:</strong> made for example build 2. The installed example build is 3.</p><p>You can still enable this release and try launching.</p>'+(pending?'<p>Your edits are saved and waiting for game exit.</p>':''))}else if(a==='cleanup'){dialog('Remove Starframe from game','<p>The installed app restores backed-up originals and removes only owned integration files. Collections, local sources and mod settings stay intact.</p><p>No game files are present in this specimen.</p>')}else if(a==='logs'){dialog('Example diagnostics','<p>Game observed: closed<br>Deployment: confirmed<br>Catalog: cached<br>Runtime report: no current game session</p><p class="muted">The real export flow previews and filters personal paths before sharing.</p>')}else if(a==='source'){dialog('Source information','<p>Real mod details link to the approved author release or show the imported local source path. These specimen entries have no download source.</p>')}else if(a==='coreSettings'||a==='terrainSettings'){dialog(a==='coreSettings'?'Core Library':'Terrain Tools','<p>This example mod has no exposed settings. Activation and dependency details remain available in the desktop manager.</p>')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;render()}if(e.target.id==='overlay-scale'){gameSettings.scale=Number(e.target.value);$('#scale-value').textContent=e.target.value+'%';$('#game-saved').textContent='Overlay scale saved in this specimen.'}});
document.addEventListener('change',e=>{if(e.target.dataset.select){e.target.checked?selected.add(e.target.dataset.select):selected.delete(e.target.dataset.select);render()}if(e.target.id==='collection'){collection=e.target.value;requested=collection==='Minimal'?['core']:['core','terrain','tactical'];mods.forEach(m=>m.enabled=requested.includes(m.id));changed()}if(e.target.id==='scenario'){scenario=e.target.value;running=scenario==='running';pending=false;if(scenario==='error')page='downloads';render()}if(e.target.id==='motion')document.documentElement.classList.toggle('reduce',e.target.checked);if(['range-visible','density','extended'].includes(e.target.id)){gameSettings.ranges=$('#range-visible').checked;gameSettings.density=$('#density').value;gameSettings.extended=$('#extended').checked;$('#game-saved').textContent=e.target.id==='extended'?'Saved. Extended information takes effect after restart.':'Setting saved in this specimen.'}});
$('#reset').onclick=()=>{gameSettings={ranges:true,scale:100,density:'Standard',extended:false};savedCollections={Skirmish:['core','terrain','tactical'],Minimal:['core'],Sandbox:[]};clearInterval(downloadTimer);mods=structuredClone(initial);selected.clear();requested=['core','terrain','tactical'];collection='Skirmish';collectionOpen=false;scenario='normal';running=false;pending=false;page='mods';view='desktop';search='';orderNote='';download=0;$('#scenario').value='normal';render()};
$('#dialog').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#detail').hidden){$('#detail').hidden=true;returnFocus?.focus()}});
let dragged=null;document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-drag]');if(row){dragged=row.dataset.drag;e.dataTransfer.setData('text/plain',dragged);row.classList.add('dragging')}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});document.addEventListener('drop',e=>{const row=e.target.closest('[data-drag]');if(row&&dragged){e.preventDefault();move(dragged,effective().indexOf(row.dataset.drag));dragged=null}});document.addEventListener('dragend',()=>document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging')));
render();
</script>
</html>
