[package]
name = "starframe"
version = "0.1.1-dev.1"
description = "Desktop mod manager for Sanctuary: Shattered Sun"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.98"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "=2.7.3"
keyvalues-parser = "=0.2.4"
turso = { version = "=0.7.2", default-features = false }
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
ts-rs = "12.0.1"
