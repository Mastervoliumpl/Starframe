[package]
name = "starframe"
version = "0.1.0-dev.1"
description = "Desktop mod manager for Sanctuary: Shattered Sun"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.98"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
turso = { version = "=0.7.2", default-features = false }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
ts-rs = "12.0.1"
