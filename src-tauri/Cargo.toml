[package]
name = "starframe"
version = "0.5.0"
description = "Desktop mod manager for Sanctuary: Shattered Sun"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.98"
default-run = "starframe"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "=2.7.3"
keyvalues-parser = "=0.2.4"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "=1.53.1", features = ["time", "sync", "macros", "fs", "io-util"] }
sha2 = "=0.11.0"
uuid = { version = "1.26.0", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
