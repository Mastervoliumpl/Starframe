version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Revisit when svelte-check and typescript-eslint support TypeScript 7.
      - dependency-name: typescript
        versions: ['7.x']
    groups:
      desktop-tooling:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      desktop-rust:
        patterns: ['*']
