name: Bounded fuzz campaigns

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Maximum campaign duration per runner
        type: choice
        options: ['60', '300', '900']
        default: '300'
      seed:
        description: Unsigned 64-bit mutation seed
        type: string
        default: '47'

permissions:
  contents: read

jobs:
  campaign:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CAMPAIGN_SECONDS: ${{ inputs.seconds }}
      CAMPAIGN_SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - shell: bash
        run: python scripts/run_fuzz.py --seconds "$CAMPAIGN_SECONDS" --seed "$CAMPAIGN_SEED"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-${{ matrix.os }}-${{ github.run_id }}
          path: |
            test-results/fuzz/**/run.json
            test-results/fuzz/**/summary.json
            test-results/fuzz/**/campaign.json
            test-results/fuzz/**/failure.json
            test-results/fuzz/**/failure.bin
          retention-days: 14
