name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_repository.py
      - run: python scripts/versions.py
      - id: version
        run: python -c "from pathlib import Path; print('version=' + Path('VERSION').read_text().strip())" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: desktop-browser-test-results
          path: test-results/
          retention-days: 7

  windows:
    name: Rust checks and Windows build
    needs: repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run check:rust
      - run: npm run tauri -- build --no-bundle -- --locked
      - run: npm run test:native -- src-tauri/target/release/starframe.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: desktop-native-test-results
          path: test-results/native/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starframe-${{ needs.repository.outputs.version }}-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/starframe.exe
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [repository, frontend, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful applicable checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$WINDOWS_RESULT" = success
